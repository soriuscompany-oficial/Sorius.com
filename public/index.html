<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
  <title>Sorius</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --bg:      #08090d;
      --accent:  #35ae49;
      --accent2: #a162f7;
      --glow:    rgba(31, 109, 60, 0.4);
      --muted:   #555870;
      --text:    #e8eaf2;
      box-sizing: border-box;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }

    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }

    html {
      scroll-padding-top: env(safe-area-inset-top, 0px);
      height: 100%;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      height: 100%;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .orb {
      position: fixed;
      border-radius: 50%;
      pointer-events: none;
      filter: blur(80px);
    }
    .orb-1 {
      width: 600px; height: 600px;
      top: -200px; left: -150px;
      background: rgba(79,142,255,0.1);
      animation: float1 14s ease-in-out infinite alternate;
    }
    .orb-2 {
      width: 500px; height: 500px;
      bottom: -150px; right: -100px;
      background: rgba(161,98,247,0.1);
      animation: float2 16s ease-in-out infinite alternate;
    }
    @keyframes float1 { from{transform:translate(0,0)} to{transform:translate(40px,60px)} }
    @keyframes float2 { from{transform:translate(0,0)} to{transform:translate(-40px,-50px)} }

    body::before {
      content:'';
      position:fixed; inset:0;
      background-image:
        linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
      background-size: 60px 60px;
    }

    .card {
      position: relative;
      z-index: 10;
      text-align: center;
      padding: 0 24px;
      animation: fadeUp 0.8s ease both;
    }

  
    .logo {
      width: 80px; height: 80px;
      border-radius: 22px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      display: flex; align-items:center; justify-content:center;
      font-family:'Syne',sans-serif; font-weight:800; font-size:34px;
      color:#fff; margin: 0 auto 32px;
      box-shadow: 0 0 50px var(--glow);
      overflow: hidden;
    }

    h1 {
      font-family:'Syne',sans-serif;
      font-size: clamp(52px, 10vw, 96px);
      font-weight: 800;
      letter-spacing: -3px;
      line-height: 1;
      margin-bottom: 16px;
      background: linear-gradient(160deg, #fff 40%, rgba(255,255,255,0.5));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .tagline {
      font-size: clamp(16px, 3vw, 19px);
      color: var(--muted);
      font-weight: 300;
      margin-bottom: 8px;
      letter-spacing: 0.2px;
    }

    .plataforma {
      font-size: 13px;
      color: var(--muted);
      letter-spacing: 0.5px;
    }

  
    .site-footer {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 9999;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 20px 24px calc(20px + env(safe-area-inset-bottom, 0px));
    }

    .site-footer .pill {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      color: var(--text);
      text-decoration: none;
      padding: 12px 20px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 500;
      letter-spacing: 0.2px;
      white-space: nowrap;
      transition: background 0.3s, border-color 0.3s, transform 0.2s;
    }
    .site-footer a.pill:hover {
      background: rgba(255, 255, 255, 0.08);
      border-color: rgba(45, 173, 105, 0.4);
      transform: translateY(-2px);
    }
    .site-footer a.pill:active { transform: translateY(0); }

  
    .yt-attribution { cursor: default; }
    .yt-attribution .yt-powered {
      color: var(--muted);
      font-weight: 400;
    }
    .yt-attribution .yt-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .site-footer .pill svg {
      width: 20px;
      height: 20px;
      flex-shrink: 0;
    }

    .yt-attribution .yt-icon {
      width: 26px;
      height: 18px;
      flex-shrink: 0;
    }
    .yt-attribution .yt-wordmark {
      font-family: 'Arial', sans-serif;
      font-weight: 700;
      font-size: 16px;
      letter-spacing: -0.2px;
      color: #ffffff;
    }

    .footer-side {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
    }
    .footer-side.left { justify-content: flex-start; }
    .footer-side.right { justify-content: flex-end; }

    @keyframes fadeUp {
      from { opacity:0; transform:translateY(30px); }
      to   { opacity:1; transform:translateY(0); }
    }

    @media (max-width: 720px) {
      .site-footer {
        flex-direction: column;
        justify-content: center;
        align-items: center;
        gap: 14px;
        padding: 18px 16px calc(18px + env(safe-area-inset-bottom, 0px));
        max-height: 70vh;
        overflow-y: auto;
      }
      .footer-side {
        width: 100%;
        justify-content: center;
      }
      .site-footer .pill {
        width: 100%;
        max-width: 320px;
        justify-content: center;
        padding: 14px 18px;
        font-size: 13.5px;
      }
      .site-footer .pill svg {
        width: 22px;
        height: 22px;
      }
      .yt-attribution .yt-icon {
        width: 28px;
        height: 19px;
      }
    }

    @media (max-width: 380px) {
      .site-footer .pill { font-size: 12.5px; padding: 12px 14px; }
    }
  </style>
</head>
<body>

  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>

  <div class="card">

    <div class="logo">
      <img src="../img/Sorius_Logo.png" alt="Logo Sorius" style="width: 100%; height: 100%; object-fit: cover; border-radius: inherit;">
    </div>

    <h1>Sorius</h1>

    <p class="tagline">Tu reproductor de música de confianza</p>

    <p class="plataforma">Android</p>

  </div>

  <footer class="site-footer">

    <div class="footer-side left">
      <a href="politica.html" class="pill">
        <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
          <path d="M12 2l8 4v6c0 5-3.5 9-8 10-4.5-1-8-5-8-10V6l8-4z"></path>
        </svg>
        <span>Política de privacidad</span>
      </a>
    </div>

    <div class="pill yt-attribution" aria-label="Powered by YouTube">
  <span class="yt-powered">Powered by</span>
  <span class="yt-badge">
    <span class="yt-wordmark">YouTube</span>
  </span>
</div>

    <div class="footer-side right">
      <a href="https://instagram.com/sorius.pa" target="_blank" rel="noopener noreferrer" class="pill">
        <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
          <rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect>
          <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path>
          <line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line>
        </svg>
        <span>instagram sorius.pa</span>
      </a>
    </div>

  </footer>

</body>
</html>
